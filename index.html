
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汪洋羽球 LINE 授權測試</title>
<style>
body {
  margin: 0;
  padding: 24px 16px;
  background: #f1f5f4;
  font-family: Arial, sans-serif;
  color: #263b38;
}
.container {
  max-width: 480px;
  margin: 30px auto;
  padding: 28px 22px;
  background: white;
  border-radius: 18px;
}
h2, .subtitle { text-align: center; }
label {
  display: block;
  margin: 20px 0 8px;
  font-weight: bold;
}
input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d7e1dd;
  border-radius: 9px;
  font-size: 16px;
}
#status {
  margin-top: 18px;
  padding: 12px;
  background: #f5f8f7;
  border-radius: 8px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div class="container">
  <h2>汪洋羽球俱樂部</h2>
  <div class="subtitle">LINE 名稱自動帶入測試</div>

  <label>LINE 顯示名稱</label>
  <input id="lineName" placeholder="等待 LINE 授權..." readonly>

  <div id="status">準備中...</div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = '2012621482-5yzVzgJV';

async function initLineProfile() {
  const nameInput = document.getElementById('lineName');
  const status = document.getElementById('status');

  try {
    status.textContent = '① 正在初始化 LINE...';

    await liff.init({
      liffId: LIFF_ID
    });

    status.textContent =
      '② 初始化完成，LINE 環境：' + liff.isInClient();

    if (!liff.isLoggedIn()) {
      status.textContent =
        '③ 尚未登入。請確認使用 LINE LIFF 專屬網址。';
      return;
    }

    status.textContent = '④ 正在取得個人資料...';

    const profile = await liff.getProfile();

    nameInput.value = profile.displayName;

    status.textContent =
      '⑤ 成功！LINE 名稱：' + profile.displayName;

  } catch (error) {
    status.textContent =
      '發生錯誤：' + error.message;

    console.error(error);
  }
}

window.addEventListener('load', initLineProfile);
</script>
</body>
</html>
